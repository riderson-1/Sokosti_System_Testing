#
# Network core (ipc_radio) configuration override.
#
# This file configures the nRF5340 NETWORK CORE radio controller firmware
# (ipc_radio), NOT the application core. It is merged into the ipc_radio
# build by sysbuild. Do NOT edit the SDK copy at
#   <ncs>/nrf/applications/ipc_radio/prj.conf
# as that is overwritten on `west update`.
#
# The network core holds the actual radio buffers, so DLE (Data Length
# Extension) must be enabled HERE, not just in the application prj.conf.
# Without these, the controller rejects the DLE request with
# "opcode 0x2022 status 0x01" (Unknown HCI Command) and stays on the
# legacy 27-byte LL PDU, capping throughput regardless of app-core MTU.
#
# Settings validated against the Nordic Academy "BLE Fundamentals"
# Lesson 3 Exercise 2 (nRF Connect SDK v2.8.0+).
#

CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# The network core defaults to 16 connections, which wastes RAM when
# combined with larger buffers. 2 is enough for a single NUS peripheral.
CONFIG_BT_MAX_CONN=2