CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_NRFX_SPIM=y
CONFIG_NRFX_CLOCK=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

CONFIG_PRINTK=y
CONFIG_PWM=y

CONFIG_MULTITHREADING=y
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_POLL=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# USB CDC-ACM (primary transport when a host has the port open)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_SAMPLE_USBD_VID=0x2FE3
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_MANUFACTURER="Your Company"
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM Sokosti Test"
CONFIG_SAMPLE_USBD_MAX_POWER=125

CONFIG_LOG=y

# Bluetooth peripheral and Nordic UART Service
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_NUS=y
CONFIG_BT_DEVICE_NAME="Sokosti_BLE"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y

# The NCS 3.3 Bluetooth RX workqueue can overflow during MTU exchange and
# notification subscription when large ATT buffers are enabled.
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE=2048

# Large notifications: ATT MTU 498, split by the controller into DLE packets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# enable debugging
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# Thread stack usage analyzer
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_NAME=y

# Bump main stack size to accommodate SPI init and FIFO processing
CONFIG_MAIN_STACK_SIZE=4096