CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_PWM=y

CONFIG_MULTITHREADING=y
CONFIG_SYS_CLOCK_EXISTS=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Enable USB CDC-ACM serial
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y

CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_SAMPLE_USBD_VID=0x2FE3
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_MANUFACTURER="Your Company"
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM Sokosti Test"
CONFIG_SAMPLE_USBD_MAX_POWER=125